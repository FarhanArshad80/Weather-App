<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App || Real time updates</title>
    <link rel="stylesheet" href="custom.css">
    <!-- FontAwesome for weather icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="weather-container">
        <div class="search-box">
            <i class="fa-solid fa-location-dot"></i>
            <input type="text" id="city-input" placeholder="Enter city name...">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="weather-box" id="weather-box">
            <img src="https://openweathermap.org/img/wn/10d@2x.png" alt="Weather-Icon" id="weather-icon" class="weather-icon">
            <h1 class="temperature" id="temp">--°C</h1>
            <p class="description" id="description">Search for a city</p>
            <h2 class="location" id="location">---</h2>
        </div>

        <div class="weather-details" id="weather-details">
            <div class="detail-card">
                <i class="fa-solid fa-droplet"></i>
                <div class="text">
                    <span id="humidity">--%</span>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="detail-card">
                <i class="fa-solid fa-wind"></i>
                <div class="text">
                    <span id="wind">-- km/h</span>
                    <p>Wind Speed</p>
                </div>
            </div>
            <div class="detail-card">
                <i class="fa-solid fa-temperature-half"></i>
                <div class="text">
                    <span id="feels-like">--°C</span>
                    <p>Feels Like</p>
                </div>
            </div>
            <div class="detail-card">
                <i class="fa-solid fa-gauge-high"></i>
                <div class="text">
                    <span id="pressure">-- hPa</span>
                    <p>Pressure</p>
                </div>
            </div>
        </div>

        <div class="error-box" id="error-box">
            <p>Oops! City not found. Try again</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
