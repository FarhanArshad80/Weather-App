<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-App || Real time updates</title>
    <link rel="stylesheet" href="custom.css">
    <!-- FontAwesome for weather icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="weather-container">
        <div class="search-box">
            <i class="fa-solid fa-location-dot"></i>
            <input type="text" id="city-input" placeholder="Enter city name...">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button id="locate-btn" type="button" title="Use my location" aria-label="Use my location"><i class="fa-solid fa-crosshairs"></i></button>
        </div>

        <div class="unit-switch" role="group" aria-label="Temperature units">
            <button type="button" id="unit-metric" class="unit-btn is-active" aria-pressed="true">°C</button>
            <button type="button" id="unit-imperial" class="unit-btn" aria-pressed="false">°F</button>
        </div>

        <div class="recent-searches" id="recent-searches" aria-label="Recent searches" hidden></div>

        <div class="weather-box" id="weather-box">
            <img src="https://openweathermap.org/img/wn/10d@2x.png" alt="Weather-Icon" id="weather-icon" class="weather-icon">
            <h1 class="temperature" id="temp">--°C</h1>
            <p class="description" id="description">Search for a city</p>
            <div class="location-row">
                <h2 class="location" id="location">---</h2>
                <!-- Beside the name rather than in the toolbar: the thing
                     being shared is this city, and this is where it is
                     named. -->
                <button type="button" class="share-btn" id="share-btn" hidden
                        title="Copy a link to this city"
                        aria-label="Copy a link to this city">
                    <i class="fa-solid fa-link"></i>
                </button>
            </div>
            <!-- A reading is a moment, and this card can sit on screen for
                 hours. Saying how old it is costs one line and stops the
                 temperature being read as current when it is not. -->
            <p class="reading-age" id="reading-age" hidden>--</p>
        </div>

        <div class="weather-details" id="weather-details">
            <div class="detail-card">
                <i class="fa-solid fa-droplet"></i>
                <div class="text">
                    <span id="humidity">--%</span>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="detail-card">
                <i class="fa-solid fa-wind"></i>
                <div class="text">
                    <span id="wind">-- km/h</span>
                    <p>Wind Speed</p>
                </div>
            </div>
            <div class="detail-card">
                <i class="fa-solid fa-temperature-half"></i>
                <div class="text">
                    <span id="feels-like">--°C</span>
                    <p>Feels Like</p>
                </div>
            </div>
            <div class="detail-card">
                <i class="fa-solid fa-gauge-high"></i>
                <div class="text">
                    <span id="pressure">-- hPa</span>
                    <p>Pressure</p>
                </div>
            </div>
            <div class="detail-card">
                <i class="fa-solid fa-sun"></i>
                <div class="text">
                    <span id="sunrise">--:--</span>
                    <p>Sunrise</p>
                </div>
            </div>
            <div class="detail-card">
                <i class="fa-solid fa-moon"></i>
                <div class="text">
                    <span id="sunset">--:--</span>
                    <p>Sunset</p>
                </div>
            </div>
        </div>

        <div class="daylight" id="daylight" aria-label="Daylight" hidden>
            <div class="daylight-head">
                <p class="daylight-caption" id="daylight-caption">--</p>
                <p class="daylight-length" id="daylight-length">--</p>
            </div>
            <div class="daylight-track">
                <span class="daylight-fill" id="daylight-fill"></span>
                <span class="daylight-marker" id="daylight-marker"></span>
            </div>
        </div>

        <div class="hourly" id="hourly" aria-label="Next few hours" hidden>
            <div class="hourly-head">
                <h3 class="forecast-title">Next few hours</h3>
                <p class="hourly-note" id="hourly-note">--</p>
            </div>
            <div class="hourly-strip" id="hourly-strip"></div>
        </div>

        <div class="forecast" id="forecast" aria-label="Five day forecast" hidden>
            <h3 class="forecast-title">Next 5 days</h3>
            <div class="forecast-strip" id="forecast-strip"></div>
        </div>

        <div class="air-quality" id="air-quality" aria-label="Air quality" hidden>
            <div class="air-dial" id="air-dial">
                <span class="air-index" id="air-index">-</span>
            </div>
            <div class="air-readout">
                <p class="air-label" id="air-label">--</p>
                <p class="air-particles">
                    PM2.5 <span id="air-pm25">--</span> &middot; PM10 <span id="air-pm10">--</span> &micro;g/m&sup3;
                </p>
            </div>
        </div>

        <div class="error-box" id="error-box">
            <p>Oops! City not found. Try again</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
